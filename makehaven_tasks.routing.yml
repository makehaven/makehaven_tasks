makehaven_tasks.settings_form:
  path: '/admin/config/makerspace/tasks-settings'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TasksSettingsForm'
    _title: 'MakeHaven Tasks Settings'
  requirements:
    _permission: 'administer site configuration'

makehaven_tasks.display_page:
  path: '/display/tasks/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayPage'
    _title: 'Tasks Display'
  requirements:
    _access: 'TRUE'

makehaven_tasks.my_history:
  path: '/tasks/mine'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskPersonalHistoryController::page'
    _title: 'My tasks'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.facilitator:
  path: '/tasks/facilitator'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskFacilitatorController::page'
    _title: 'Specialist tasks'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.retroactive_log:
  path: '/tasks/log'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskRetroactiveLogForm'
    _title: 'Log something I already fixed'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.request:
  path: '/tasks/request'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskRequestForm'
    _title_callback: '\Drupal\makehaven_tasks\Form\TaskRequestForm::title'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.claim:
  path: '/tasks/{node}/claim'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskActionController::claim'
    _title: 'Claim task'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.help:
  path: '/tasks/{node}/help'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskActionController::help'
    _title: 'Offer to help'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.handoff:
  path: '/tasks/{node}/handoff'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskHandoffForm'
    _title: 'Hand off task'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.leaderboard:
  path: '/tasks/leaderboard'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskLeaderboardController::page'
    _title: 'Task Leaderboard'
  requirements:
    _access: 'TRUE'

makehaven_tasks.manage:
  path: '/tasks/manage'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskManagerController::page'
    _title: 'Task Manager'
  requirements:
    _permission: 'makehaven_tasks.manage_tasks'

makehaven_tasks.bank:
  path: '/tasks/bank'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskBankController::listPage'
    _title: 'Task Bank'
  requirements:
    _permission: 'makehaven_tasks.create_from_bank'

makehaven_tasks.bank_create:
  path: '/tasks/bank/{node}/create'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskBankController::createFromBank'
    _title: 'Create task from bank'
  requirements:
    _permission: 'makehaven_tasks.create_from_bank'
    node: '\d+'

makehaven_tasks.display_fragment:
  path: '/display/tasks/fragment/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayFragment'
    _title: 'Tasks Display Fragment'
  requirements:
    _access: 'TRUE'

makehaven_tasks.volunteer:
  path: '/volunteer'
  defaults:
    _controller: '\Drupal\views\Routing\ViewPageController::handle'
    view_id: tasks
    display_id: page_tasks_interactive
    _title: 'Volunteer'
  requirements:
    _permission: 'access content'
  options:
    _view_display_plugin_class: '\Drupal\views\Plugin\views\display\Page'
    _view_argument_map: {  }

makehaven_tasks.approvals:
  path: '/tasks/approvals'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\VolunteerApprovalsController::page'
    _title: 'Volunteer approvals'
  requirements:
    _permission: 'makehaven_tasks.create_task'

makehaven_tasks.interest:
  path: '/tasks/{node}/interest'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\VolunteerInterestForm'
    _title: "I'm in"
  requirements:
    _user_is_logged_in: 'TRUE'
    _entity_access: 'node.view'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node

makehaven_tasks.decide:
  path: '/tasks/{node}/decide'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\VolunteerDecisionForm'
    _title: 'Approve or decline'
  requirements:
    _permission: 'makehaven_tasks.create_task'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node

makehaven_tasks.edit:
  path: '/tasks/{node}/edit'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskRequestForm'
    _title: 'Edit'
  requirements:
    _custom_access: '\Drupal\makehaven_tasks\Form\TaskRequestForm::editAccessRoute'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node

makehaven_tasks.preferences:
  path: '/tasks/preferences'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\VolunteerPreferencesForm'
    _title: 'How would you like to help?'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.perks:
  path: '/tasks/thank-yous'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\VolunteerPerksController::page'
    _title: 'Volunteer thank-yous'
  requirements:
    _permission: 'makehaven_tasks.create_task'

makehaven_tasks.pool:
  path: '/tasks/volunteers'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\VolunteerPoolController::page'
    _title: 'Volunteer pool'
  requirements:
    _permission: 'makehaven_tasks.create_task'

# Job board: outside requests from the Hire a Maker form (/commission).
makehaven_tasks.job_board:
  path: '/admin/content/job-board'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\JobBoardController::queue'
    _title: 'Job board'
  requirements:
    _permission: 'review job board'

makehaven_tasks.job_board.approve:
  path: '/admin/content/job-board/{node}/approve'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\JobBoardController::approve'
  requirements:
    _permission: 'review job board'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

makehaven_tasks.job_board.decline:
  path: '/admin/content/job-board/{node}/decline'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\JobBoardController::decline'
  requirements:
    _permission: 'review job board'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

makehaven_tasks.job_board.repost:
  path: '/admin/content/job-board/{node}/repost'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\JobBoardController::repost'
  requirements:
    _permission: 'review job board'
    _csrf_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
