makehaven_tasks.settings_form:
  path: '/admin/config/makehaven/tasks-settings'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TasksSettingsForm'
    _title: 'MakeHaven Tasks Settings'
  requirements:
    _permission: 'administer site configuration'

makehaven_tasks.display_page:
  path: '/display/tasks/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayPage'
    _title: 'Tasks Display'
  requirements:
    _access: 'TRUE'

makehaven_tasks.display_fragment:
  path: '/display/tasks/fragment/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayFragment'
    _title: 'Tasks Display Fragment'
  requirements:
    _access: 'TRUE'

makehaven_tasks.dashboard:
  path: '/tasks/dashboard'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskDashboardController::content'
    _title: 'Task Dashboard'
  requirements:
    _permission: 'access content'

makehaven_tasks.series_admin:
  path: '/admin/content/tasks/recurring'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskSeriesAdminController::content'
    _title: 'Recurring Task Series'
  requirements:
    _permission: 'edit any task content'

makehaven_tasks.claim:
  path: '/tasks/{node}/claim'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskStatusController::claim'
    _title: 'Claim Task'
  requirements:
    _permission: 'access content'
    _csrf_token: 'TRUE'
    node: \d+

makehaven_tasks.handoff:
  path: '/tasks/{node}/handoff'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskHandoffForm'
    _title: 'Hand Off Task'
  requirements:
    _permission: 'access content'
    node: \d+

makehaven_tasks.log_fix:
  path: '/tasks/log-fix'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskLogFixForm'
    _title: 'Log Something I Fixed'
  requirements:
    _user_is_logged_in: 'TRUE'
