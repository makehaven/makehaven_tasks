makehaven_tasks.settings_form:
  path: '/admin/config/makerspace/tasks-settings'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TasksSettingsForm'
    _title: 'MakeHaven Tasks Settings'
  requirements:
    _permission: 'administer site configuration'

makehaven_tasks.display_page:
  path: '/display/tasks/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayPage'
    _title: 'Tasks Display'
  requirements:
    _access: 'TRUE'

makehaven_tasks.my_history:
  path: '/tasks/mine'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskPersonalHistoryController::page'
    _title: 'My tasks'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.facilitator:
  path: '/tasks/facilitator'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskFacilitatorController::page'
    _title: 'Specialist tasks'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.retroactive_log:
  path: '/tasks/log'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskRetroactiveLogForm'
    _title: 'Log something I already fixed'
  requirements:
    _user_is_logged_in: 'TRUE'

makehaven_tasks.claim:
  path: '/tasks/{node}/claim'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskActionController::claim'
    _title: 'Claim task'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.help:
  path: '/tasks/{node}/help'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskActionController::help'
    _title: 'Offer to help'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.handoff:
  path: '/tasks/{node}/handoff'
  defaults:
    _form: '\Drupal\makehaven_tasks\Form\TaskHandoffForm'
    _title: 'Hand off task'
  requirements:
    _user_is_logged_in: 'TRUE'
    node: '\d+'

makehaven_tasks.leaderboard:
  path: '/tasks/leaderboard'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskLeaderboardController::page'
    _title: 'Task Leaderboard'
  requirements:
    _access: 'TRUE'

makehaven_tasks.manage:
  path: '/tasks/manage'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskManagerController::page'
    _title: 'Task Manager'
  requirements:
    _permission: 'makehaven_tasks.manage_tasks'

makehaven_tasks.bank:
  path: '/tasks/bank'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskBankController::listPage'
    _title: 'Task Bank'
  requirements:
    _permission: 'makehaven_tasks.create_from_bank'

makehaven_tasks.bank_create:
  path: '/tasks/bank/{node}/create'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TaskBankController::createFromBank'
    _title: 'Create task from bank'
  requirements:
    _permission: 'makehaven_tasks.create_from_bank'
    node: '\d+'

makehaven_tasks.display_fragment:
  path: '/display/tasks/fragment/{code_word}'
  defaults:
    _controller: '\Drupal\makehaven_tasks\Controller\TasksDisplayController::displayFragment'
    _title: 'Tasks Display Fragment'
  requirements:
    _access: 'TRUE'
