makehaven_tasks.settings:
  type: config_object
  label: 'MakeHaven Tasks settings'
  mapping:
    code_word:
      type: string
      label: 'Signage display code word'
    volunteer_slack_channel:
      type: string
      label: 'Slack channel for volunteer recruitment posts'
    ready_to_approve_email:
      type: string
      label: 'Address that gets the "ready to approve" email'
    gathering_days:
      type: integer
      label: 'Default days to gather interest before the decide-by date'
    short_reminder_days:
      type: integer
      label: 'Days before decide-by to post one "needs N more" reminder'
    member_suggestion_stage:
      type: string
      label: 'Stage a member-suggested opportunity starts in (gathering or proposed)'
    stale_first_days:
      type: integer
      label: 'Days idle before the first stale-claim nudge'
    stale_second_days:
      type: integer
      label: 'Days idle before the second stale-claim nudge'
    checkin_days:
      type: integer
      label: 'Days after a claim before the one "How''s it going?" check-in (0 = off)'
    checkin_cc:
      type: string
      label: 'Staff address copied on the claim check-in'
    perk_lunch_amount:
      type: integer
      label: 'Lunch thank-you, in dollars'
    perk_lunch_hours:
      type: float
      label: 'Hours volunteered in one day that earn the lunch thank-you'
    perk_hoodie_dates:
      type: integer
      label: 'Days volunteered that earn a hoodie'
    perk_tshirt_material:
      type: integer
      label: 'Store item (node id) for the t-shirt'
    perk_hoodie_material:
      type: integer
      label: 'Store item (node id) for the hoodie'
    outreach_slack_channel:
      type: string
      label: 'Slack channel that gets a summary of new tabling opportunities'
    job_board_post_to_slack:
      type: boolean
      label: 'Job board: post approved requests to Slack'
    job_board_channel:
      type: string
      label: 'Job board: Slack channel (ID or name) for approved requests'
    job_board_trade_channels:
      type: integer
      label: 'Job board: most trade channels to cross-post a pointer to'
    job_board_review_channel:
      type: string
      label: 'Job board: channel for the "waiting for review" alert (empty = DM reviewers)'
    job_board_review_group:
      type: string
      label: 'Job board: Slack user group ID mentioned in the review alert (e.g. @staff)'
    job_board_trusted_senders:
      type: sequence
      label: 'Job board: requester emails or @domains whose requests skip review'
      sequence:
        type: string
